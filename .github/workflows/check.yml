name: Check Hayward login
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python logger.py --check
        env:
          HAYWARD_USER: ${{ secrets.HAYWARD_USER }}
          HAYWARD_PASSWORD: ${{ secrets.HAYWARD_PASSWORD }}
          HAYWARD_MSP_ID: ${{ secrets.HAYWARD_MSP_ID }}
          HAYWARD_BOW_ID: ${{ secrets.HAYWARD_BOW_ID }}
